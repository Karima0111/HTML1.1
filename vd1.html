<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="image-display">
        <h2>Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.</h2>
    </div>

    <div id="gallery">
        <img src="https://picsum.photos/600/400?random=1" 
             alt="Hình ảnh 1" 
             class="preview-pic" 
             data-full="https://picsum.photos/600/400?random=1">

        <img src="https://picsum.photos/600/400?random=2" 
             alt="Hình ảnh 2" 
             class="preview-pic" 
             data-full="https://picsum.photos/600/400?random=2">

        <img src="https://picsum.photos/600/400?random=3" 
             alt="Hình ảnh 3" 
             class="preview-pic" 
             data-full="https://picsum.photos/600/400?random=3">

        <img src="https://picsum.photos/600/400?random=4" 
             alt="Hình ảnh 4" 
             class="preview-pic" 
             data-full="https://picsum.photos/600/400?random=4">
    </div>

    <button id="undo-button">Hoàn tác</button>

    <script src="script.js"></script>
</body>
</html>
